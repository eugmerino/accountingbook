<!DOCTYPE html>
<html lang="en">

<head>
  <title>AccountingBook</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-4" href="{% url "home" %}">AccountingBook</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav me-auto">
          <!-- Dropdown: Catálogo de Cuentas -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Catálogo de Cuentas</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="{% url "accounts" %}">Cuentas</a></li>
              <li><a class="dropdown-item" href="#">Naturaleza de las Cuentas</a></li>
            </ul>
          </li>
          <!-- Dropdown: Libro Diario -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Libro Diario</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Partidas</a></li>
              <li><a class="dropdown-item" href="#">Partidas de Ajuste</a></li>
            </ul>
          </li>
          <!-- Links adicionales -->
          <li class="nav-item">
            <a class="nav-link" href="#">Balanza de Comprobación</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Estado de Resultado</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Balance General</a>
          </li>
        </ul>
        <!-- Dropdown a la derecha -->
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="{% url "logout" %}"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container-fluid mt-4">
    {% block content %}
    {% endblock %}
  </div>

  
</body>

</html>
