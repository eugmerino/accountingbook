{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" href="{% static 'img/libro-abierto.png' %}" type="image/x-icon">
</head>
<div class="container-fluid bg-light min-vh-100 d-flex align-items-center">
  <div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-4">
      <div class="text-center">
        <img src="{% static 'img/libro-abierto.png' %}" alt="logo" class="img-fluid mb-4" style="max-width: 150px;">
        <h1 class="text-dark mb-3">AccountingBook</h1>
        <h4 class="text-muted">Inicio de Sesión</h4>
      </div>
      <form method="POST" class="p-4 border rounded bg-white shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
          {{form}}
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-dark btn-lg">Iniciar Sesión</button>
        </div>
        {% if error %}
        <div class="mt-3 text-danger text-center">
          {{error}}
        </div>
        {% endif %}
      </form>
    </div>
  </div>
</div>

</html>
